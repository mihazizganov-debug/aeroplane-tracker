[tool.poetry]
name = "aeroplane-tracker"
version = "0.1.0"
description = "Интеграция с API для отслеживания самолетов в воздушном пространстве стран"
authors = ["MikhailZizganov <mihazizganov@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.5"
python-dotenv = "^1.0.0"
# Для работы с датами (пригодятся в самолетах)
python-dateutil = "^2.9.0"
pytz = "^2025.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
flake8 = "^7.3.0"
black = "^25.12.0"
isort = "^7.0.0"
mypy = "^1.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============ КОНФИГУРАЦИЯ ЛИНТЕРОВ ============

[tool.black]
line-length = 119
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ['venv']

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=term --cov-report=html"